<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a3a3a">
<title>Profile Card — preview</title>

<!--
  Standalone export of components/sections/ProfileCard.tsx, for eyeballing in a
  browser without running the dev server.

  This is a preview artifact, NOT part of the Next.js build — it lives outside
  app/ and public/ on purpose so it never ships. The React component remains
  the source of truth; if you change one, change the other.

  Everything is self-contained except the avatar and the two web fonts, which
  load from the network. Drop the file anywhere and it still works.

  Responsive: one fluid scale (see the --* clamps in :root) drives the whole
  card, so there are no layout jumps between breakpoints. Every clamp pinpoints
  to its original fixed px at a 591px viewport, which is where the 511px card
  stops growing — so desktop is unchanged and everything below scales down from
  there. The action buttons wrap to a column on their own once they can no
  longer fit on one line, so there is no breakpoint to keep in sync.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Syne:wght@400&display=swap" rel="stylesheet">

<style>
  /* Tokens — mirror of the --color-profile-* block in app/globals.css */
  :root {
    --surface: #000000;
    --online: #20f23c;
    --online-soft: rgba(32, 242, 60, 0.3);
    --action: #202e39;
    --action-alt: #262628;
    --bar: #44a151;

    --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-accent: "Syne", ui-sans-serif, system-ui, sans-serif;

    /* --- responsive scale ---
       Every inner clamp below resolves to its original fixed px at a 591px
       viewport. That is the width at which the 511px card stops growing
       (511 + 2x40 gutters); wider than that the clamps are pinned to the
       original numbers, so the desktop rendering is pixel-identical.
       Narrower, they shrink roughly in step with the card, so no rule ever
       has to overflow or clip.

       The floors are deliberately higher than a strictly proportional scale
       would give. This is a card people actually read, so 12px labels on a
       360px phone would be a bad trade — the layout absorbs the extra
       wrapping instead. --gutter is the exception: it is just the page
       margin and never affects the card, which is capped well below it. */
    --gutter: clamp(16px, 5vw, 40px);
    --card-pad: clamp(20px, 5.41vw, 32px);
    --card-gap: clamp(20px, 5.41vw, 32px);
    --card-radius: clamp(22px, 6.77vw, 40px);
    --avatar: clamp(48px, 9.14vw, 54px);
    --bar-icon: clamp(14px, 3.38vw, 20px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 100dvh tracks the mobile URL bar collapsing; 100vh is the fallback for
       browsers that don't know dvh. */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* max() keeps the safe-area inset from being eaten by the gutter on
       notched devices (viewport-fit=cover above lets the card reach the
       edges, which is what makes the env() values non-zero). */
    padding-top: max(var(--gutter), env(safe-area-inset-top));
    padding-right: max(var(--gutter), env(safe-area-inset-right));
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
    padding-left: max(var(--gutter), env(safe-area-inset-left));
    background: #3a3a3a; /* neutral backdrop so the card's edges read */
    font-family: var(--font-body);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    /* iOS inflates text in landscape without this. */
    -webkit-text-size-adjust: 100%;
  }

  /* Outer cap — 511px, matching the Figma frame. The status bar below is
     431px, i.e. 511 - 2x40, so its square corners meet the card's 40px
     bottom radius exactly. That ratio is the whole effect; don't change one
     without the other — which is why the bar's inset is derived from
     --card-radius rather than hard-coded, so the two stay locked together
     as the card scales down. */
  .profile-card {
    width: 100%;
    max-width: 511px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--card-gap);
    padding: var(--card-pad);
    background: var(--surface);
    border-radius: var(--card-radius);
  }

  /* --- availability + local time --- */
  .card__top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* Safety net on very narrow screens: the clock drops to its own line
       rather than colliding with the badge. The gap is a minimum, so
       space-between still governs the spacing everywhere it fits. */
    flex-wrap: wrap;
    gap: clamp(8px, 1.35vw, 12px);
  }

  .availability {
    display: inline-flex;
    align-items: center;
    gap: clamp(5px, 1.02vw, 6px);
    padding: clamp(3px, 0.68vw, 4px) clamp(10px, 2.03vw, 12px);
    border-radius: 50px;
    background: var(--online-soft);
    flex: none;
  }

  .availability__dot {
    width: clamp(7px, 1.35vw, 8px);
    height: clamp(7px, 1.35vw, 8px);
    border-radius: 20px;
    background: var(--online);
    flex: none;
    animation: dot-glow 2s ease-out infinite;
  }

  .availability__label {
    font-size: clamp(11px, 2.03vw, 12px);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .clock {
    margin: 0;
    /* auto keeps the clock right-aligned even on the line it wraps onto,
       where space-between alone would push it to the left. */
    margin-left: auto;
    font-size: clamp(14px, 2.71vw, 16px);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .clock__period { font-family: var(--font-accent); }

  /* --- identity --- */
  .identity {
    width: 100%;
    display: flex;
    align-items: center;
    gap: clamp(12px, 2.71vw, 16px);
  }

  .identity__avatar {
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    border: clamp(1px, 0.25vw, 1.5px) solid #fff;
    object-fit: cover;
    flex: none;
  }

  .identity__text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(2px, 0.51vw, 3px);
  }

  .identity__name {
    margin: 0;
    font-size: clamp(18px, 3.89vw, 23px);
    letter-spacing: 0.02em;
  }

  .identity__role {
    margin: 0;
    font-size: clamp(14px, 3.05vw, 18px);
    letter-spacing: 0.02em;
    opacity: 0.8;
  }

  /* --- actions ---
     flex-wrap plus a small flex-basis makes the two buttons fall into a
     full-width column by themselves once their text can no longer share a
     line — the line breaker measures each button at its min-content width
     (they are nowrap), so the switch happens exactly when it has to. No
     breakpoint, and nothing to keep in sync with the React version. */
  .actions {
    width: 100%;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(12px, 2.71vw, 16px);
  }

  .action {
    flex: 1 1 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(13px, 2.71vw, 16px) clamp(16px, 5.41vw, 32px);
    border: 0;
    border-radius: 70px;
    font-family: inherit;
    font-size: clamp(15px, 3.05vw, 18px);
    letter-spacing: 0.02em;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .action:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  .action--hire { background: var(--action); }
  .action--hire:hover { background: rgba(32, 46, 57, 0.8); }

  .action--portfolio { background: var(--action-alt); }
  .action--portfolio:hover { background: rgba(38, 38, 40, 0.8); }

  /* --- status bar ---
     The inline inset is 2x --card-radius, so the bar's square top corners
     land on the card's bottom-radius endpoints at every size — 511 - 80 =
     431 on desktop, and proportionally the same on a phone. max-width is the
     original cap, kept as a guard. */
  .status-bar {
    width: calc(100% - (var(--card-radius) * 2));
    max-width: 431px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(9px, 2.03vw, 12px) clamp(8px, 1.69vw, 10px);
    background: var(--bar);
    border-radius: 0 0 100px 100px;
    overflow: hidden;
  }

  .status-bar__inner {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(5px, 1.02vw, 6px);
  }

  .status-bar__icon {
    width: var(--bar-icon);
    height: var(--bar-icon);
    flex: none;
    animation: icon-blink 1.5s ease-in-out infinite;
  }

  /* The label is the widest single run of text in the card, and the bar is
     the narrowest box once its inset (2x the card radius) is taken off, so
     this floor is what actually sets the smallest supported width. At 12px
     the whole pill is ~204px against ~228px of room on a 320px screen. */
  .status-bar__label {
    margin: 0;
    font-size: clamp(12px, 3.05vw, 18px);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  /* --- motion (added on request; the Figma mockup is static) ---
     The dot carries a constant halo plus a ring that expands and fades. The
     halo alone reads as a static blur — the ring is what makes it glow. */
  @keyframes dot-glow {
    0% {
      box-shadow:
        0 0 0 0 rgba(32, 242, 60, 0.6),
        0 0 6px 1px rgba(32, 242, 60, 0.9);
    }
    70%,
    100% {
      box-shadow:
        0 0 0 6px rgba(32, 242, 60, 0),
        0 0 6px 1px rgba(32, 242, 60, 0.9);
    }
  }

  @keyframes icon-blink {
    0%,
    100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* Keep the glow, drop the pulsing — a static halo still reads as "live". */
  @media (prefers-reduced-motion: reduce) {
    .availability__dot {
      animation: none;
      box-shadow: 0 0 6px 1px rgba(32, 242, 60, 0.9);
    }
    .status-bar__icon { animation: none; }
  }

</style>
</head>

<body>
  <div class="profile-card">
    <div class="card">

      <div class="card__top">
        <div class="availability">
          <span class="availability__dot"></span>
          <span class="availability__label">Available for Work</span>
        </div>

        <!-- Filled in by the script below; empty until it runs, same as the
             React version, so there's no server/client mismatch. -->
        <p class="clock"><span data-clock-time></span> <span class="clock__period" data-clock-period></span></p>
      </div>

      <div class="identity">
        <img
          class="identity__avatar"
          src="https://framerusercontent.com/images/GuZzzD0CwvBaE3VtG1YioCKYI.jpg"
          alt="Olamilekan Charles Akinyemi"
          width="54"
          height="54"
        >
        <div class="identity__text">
          <p class="identity__name">Olamilekan Charles Akinyemi</p>
          <p class="identity__role">UI/UX Designer &amp; Framer Developer</p>
        </div>
      </div>

      <div class="actions">
        <a
          class="action action--hire"
          href="https://cal.com/olamilekan-charles-akinyemi-fifjf3/15min"
          target="_blank"
          rel="noopener noreferrer"
        >Hire Me</a>
        <a
          class="action action--portfolio"
          href="https://akinyemi.com.ng/"
          target="_blank"
          rel="noopener noreferrer"
        >See Portfolio</a>
      </div>

    </div>

    <div class="status-bar">
      <div class="status-bar__inner">
        <!-- Lightning bolt, inlined so this file needs no sibling assets and
             no encoding step. Same path data as public/profile-card/energy.svg,
             with a fill instead of a stroke. -->
        <svg
          class="status-bar__icon"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path d="M5.16126 9.49708L10.16 2.75988C10.5509 2.23297 11.2837 2.56092 11.2837 3.2628V8.47742C11.2837 8.89792 11.5711 9.23875 11.9256 9.23875H14.3569C14.9092 9.23875 15.2036 10.0112 14.8387 10.5029L9.84 17.2401C9.44908 17.767 8.71625 17.4391 8.71625 16.7372V11.5226C8.71625 11.1021 8.42892 10.7612 8.07443 10.7612H5.64311C5.09079 10.7612 4.79638 9.98883 5.16126 9.49708Z" fill="white"/>
        </svg>
        <p class="status-bar__label">Currently High On Creativity</p>
      </div>
    </div>
  </div>

<script>
  var TIME_ZONE = "Africa/Lagos";

  /* --- live Lagos clock --- */
  var timeEl = document.querySelector("[data-clock-time]");
  var periodEl = document.querySelector("[data-clock-period]");

  function renderClock() {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: TIME_ZONE,
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    }).formatToParts(new Date());

    timeEl.textContent = parts
      .filter(function (p) { return p.type === "hour" || p.type === "minute"; })
      .map(function (p) { return p.value; })
      .join(":");

    var period = parts.find(function (p) { return p.type === "dayPeriod"; });
    periodEl.textContent = period ? period.value : "";
  }

  renderClock();
  setInterval(renderClock, 60000);
</script>
</body>
</html>
