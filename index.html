<!--
  Standalone export of components/sections/ProfileCard.tsx, for eyeballing in a
  browser without running the dev server.

  This is a preview artifact, NOT part of the Next.js build — it lives outside
  app/ and public/ on purpose so it never ships. The React component remains
  the source of truth; if you change one, change the other.

  Everything is self-contained except the avatar and the two web fonts, which
  load from the network. Drop the file anywhere and it still works.

  Responsive: the whole card is sized off a single unit, --u, which is one
  pixel of the 511px frame. Figma's mobile frame (node 113:7) turned out to be
  this same card scaled by exactly 320/511 = 0.62622 — padding 32 -> 20.039,
  radius 40 -> 25.049, name 23 -> 14.403, status bar 431 -> 269.902 — so one
  multiplier reproduces it at every width. There are no breakpoints and no
  per-size overrides to keep in sync. See the --u comment for how the scale
  and the gutter behave.

  The frame draws the card flush to its 320px edge, but on a real phone that
  reads as touching the bezel, so the card now holds a 20px gutter minimum.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Syne:wght@400&display=swap" rel="stylesheet">

<style>
  /* Tokens — mirror of the --color-profile-* block in app/globals.css */
  :root {
    --surface: #000000;
    --online: #20f23c;
    --online-soft: rgba(32, 242, 60, 0.3);
    --action: #202e39;
    --action-alt: #262628;
    --bar: #44a151;

    --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-accent: "Syne", ui-sans-serif, system-ui, sans-serif;

    /* --- breathing room ---
       20px minimum, so the card never touches the screen edge, growing to
       the original 40px once the viewport is wide enough (591px) for the
       card to sit at its full 511px. Between 511 and 591 it eases from 20 to
       40 as the viewport grows.

       --edge-x is that gutter widened to clear any hardware inset. It is the
       single source of truth for BOTH the body's side padding and --u below,
       which is what keeps the card exactly 511u wide at every size — if the
       two ever disagreed the card would overflow. */
    --gutter: clamp(20px, (100vw - 511px) / 2, 40px);
    --edge-x: max(var(--gutter), env(safe-area-inset-left), env(safe-area-inset-right));

    /* --- scale ---
       --u is one pixel of the 511px Figma frame, and every size below is
       written as a multiple of it, so the card scales as a single object.

       It is derived from the card's own width rather than the viewport's.
       The card is 511u by construction, so its padding is 32u, its radius
       40u and its status bar 431u at every width, exactly as the 511px frame
       specifies. Figma's mobile frame (node 113:7) is this same card at
       u = 320/511.

       min(..., 1px) pins the scale at 1:1 once the card reaches its 511px
       cap, so desktop is unchanged. */
    --u: min(calc((100vw - 2 * var(--edge-x)) / 511), 1px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 100dvh tracks the mobile URL bar collapsing; 100vh is the fallback for
       browsers that don't know dvh. */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* max() so a notch or home-indicator inset outranks the gutter on a
       phone: the card keeps its 20px by default but never sits under the
       hardware. The side padding is --edge-x rather than the same max()
       spelled out again, so it cannot drift from what --u assumed. */
    padding-top: max(var(--gutter), env(safe-area-inset-top));
    padding-right: var(--edge-x);
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
    padding-left: var(--edge-x);
    background: #3a3a3a; /* neutral backdrop so the card's edges read */
    font-family: var(--font-body);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    /* iOS inflates text in landscape without this. */
    -webkit-text-size-adjust: 100%;
  }

  /* Outer cap — 511px, matching the Figma frame. The status bar below is
     431px, i.e. 511 - 2x40, so its square corners meet the card's 40px
     bottom radius exactly. That ratio is the whole effect, and it survives
     scaling because the bar's inset is derived from the card radius rather
     than hard-coded. */
  .profile-card {
    width: 100%;
    max-width: 511px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: calc(32 * var(--u));
    padding: calc(32 * var(--u));
    background: var(--surface);
    border-radius: calc(40 * var(--u));
  }

  /* --- availability + local time --- */
  .card__top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* Safety net: if the badge and clock ever can't share a line the clock
       drops to its own. The gap is a minimum, so space-between still governs
       the spacing everywhere they do fit. */
    flex-wrap: wrap;
    gap: calc(8 * var(--u));
  }

  .availability {
    display: inline-flex;
    align-items: center;
    gap: calc(6 * var(--u));
    padding: calc(4 * var(--u)) calc(12 * var(--u));
    border-radius: calc(50 * var(--u));
    background: var(--online-soft);
    flex: none;
  }

  .availability__dot {
    width: calc(8 * var(--u));
    height: calc(8 * var(--u));
    border-radius: calc(20 * var(--u));
    background: var(--online);
    flex: none;
    animation: dot-glow 2s ease-out infinite;
  }

  .availability__label {
    font-size: calc(12 * var(--u));
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .clock {
    margin: 0;
    /* auto keeps the clock right-aligned even on the line it wraps onto,
       where space-between alone would push it to the left. */
    margin-left: auto;
    font-size: calc(16 * var(--u));
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .clock__period { font-family: var(--font-accent); }

  /* --- identity --- */
  .identity {
    width: 100%;
    display: flex;
    align-items: center;
    gap: calc(16 * var(--u));
  }

  .identity__avatar {
    width: calc(54 * var(--u));
    height: calc(54 * var(--u));
    border-radius: 50%;
    border: calc(1.5 * var(--u)) solid #fff;
    object-fit: cover;
    flex: none;
  }

  .identity__text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: calc(3 * var(--u));
  }

  .identity__name {
    margin: 0;
    font-size: calc(23 * var(--u));
    letter-spacing: 0.02em;
  }

  .identity__role {
    margin: 0;
    font-size: calc(18 * var(--u));
    letter-spacing: 0.02em;
    opacity: 0.8;
  }

  /* --- actions ---
     Both buttons scale with everything else, so they share a line at every
     width exactly as the frame shows. flex-wrap is only a fallback: if a
     font metric ever runs wider than expected they stack full-width instead
     of overflowing the card, which is the failure mode that matters. */
  .actions {
    width: 100%;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: calc(16 * var(--u));
  }

  .action {
    flex: 1 1 calc(120 * var(--u));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(16 * var(--u)) calc(32 * var(--u));
    border: 0;
    border-radius: calc(70 * var(--u));
    font-family: inherit;
    font-size: calc(18 * var(--u));
    letter-spacing: 0.02em;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .action:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  .action--hire { background: var(--action); }
  .action--hire:hover { background: rgba(32, 46, 57, 0.8); }

  .action--portfolio { background: var(--action-alt); }
  .action--portfolio:hover { background: rgba(38, 38, 40, 0.8); }

  /* --- status bar ---
     Inset by 2x the card radius, so its square top corners land on the
     card's bottom-radius endpoints at every scale: 511 - 80 = 431 on
     desktop, and exactly 431u at every other width, because the card itself
     is 511u. max-width is the original cap, kept as a guard. */
  .status-bar {
    width: calc(100% - 80 * var(--u));
    max-width: 431px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(12 * var(--u)) calc(10 * var(--u));
    background: var(--bar);
    border-radius: 0 0 calc(100 * var(--u)) calc(100 * var(--u));
    overflow: hidden;
  }

  .status-bar__inner {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: calc(6 * var(--u));
  }

  .status-bar__icon {
    width: calc(20 * var(--u));
    height: calc(20 * var(--u));
    flex: none;
    animation: icon-blink 1.5s ease-in-out infinite;
  }

  .status-bar__label {
    margin: 0;
    font-size: calc(18 * var(--u));
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  /* --- motion (added on request; the Figma mockup is static) ---
     The dot carries a constant halo plus a ring that expands and fades. The
     halo alone reads as a static blur — the ring is what makes it glow. */
  @keyframes dot-glow {
    0% {
      box-shadow:
        0 0 0 0 rgba(32, 242, 60, 0.6),
        0 0 calc(6 * var(--u)) calc(1 * var(--u)) rgba(32, 242, 60, 0.9);
    }
    70%,
    100% {
      box-shadow:
        0 0 0 calc(6 * var(--u)) rgba(32, 242, 60, 0),
        0 0 calc(6 * var(--u)) calc(1 * var(--u)) rgba(32, 242, 60, 0.9);
    }
  }

  @keyframes icon-blink {
    0%,
    100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* Keep the glow, drop the pulsing — a static halo still reads as "live". */
  @media (prefers-reduced-motion: reduce) {
    .availability__dot {
      animation: none;
      box-shadow: 0 0 calc(6 * var(--u)) calc(1 * var(--u)) rgba(32, 242, 60, 0.9);
    }
    .status-bar__icon { animation: none; }
  }

</style>
</head>

<body>
  <div class="profile-card">
    <div class="card">

      <div class="card__top">
        <div class="availability">
          <span class="availability__dot"></span>
          <span class="availability__label">Available for Work</span>
        </div>

        <!-- Filled in by the script below; empty until it runs, same as the
             React version, so there's no server/client mismatch. -->
        <p class="clock"><span data-clock-time></span> <span class="clock__period" data-clock-period></span></p>
      </div>

      <div class="identity">
        <img
          class="identity__avatar"
          src="https://framerusercontent.com/images/GuZzzD0CwvBaE3VtG1YioCKYI.jpg"
          alt="Olamilekan Charles Akinyemi"
          width="54"
          height="54"
        >
        <div class="identity__text">
          <p class="identity__name">Olamilekan Charles Akinyemi</p>
          <p class="identity__role">UI/UX Designer &amp; Framer Developer</p>
        </div>
      </div>

      <div class="actions">
        <a
          class="action action--hire"
          href="https://cal.com/olamilekan-charles-akinyemi-fifjf3/15min"
          target="_blank"
          rel="noopener noreferrer"
        >Hire Me</a>
        <a
          class="action action--portfolio"
          href="https://akinyemi.com.ng/"
          target="_blank"
          rel="noopener noreferrer"
        >See Portfolio</a>
      </div>

    </div>

    <div class="status-bar">
      <div class="status-bar__inner">
        <!-- Lightning bolt, inlined so this file needs no sibling assets and
             no encoding step. Same path data as public/profile-card/energy.svg,
             with a fill instead of a stroke. -->
        <svg
          class="status-bar__icon"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path d="M5.16126 9.49708L10.16 2.75988C10.5509 2.23297 11.2837 2.56092 11.2837 3.2628V8.47742C11.2837 8.89792 11.5711 9.23875 11.9256 9.23875H14.3569C14.9092 9.23875 15.2036 10.0112 14.8387 10.5029L9.84 17.2401C9.44908 17.767 8.71625 17.4391 8.71625 16.7372V11.5226C8.71625 11.1021 8.42892 10.7612 8.07443 10.7612H5.64311C5.09079 10.7612 4.79638 9.98883 5.16126 9.49708Z" fill="white"/>
        </svg>
        <p class="status-bar__label">Creative mode on</p>
      </div>
    </div>
  </div>

<script>
  var TIME_ZONE = "Africa/Lagos";

  /* --- live Lagos clock --- */
  var timeEl = document.querySelector("[data-clock-time]");
  var periodEl = document.querySelector("[data-clock-period]");

  function renderClock() {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: TIME_ZONE,
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    }).formatToParts(new Date());

    timeEl.textContent = parts
      .filter(function (p) { return p.type === "hour" || p.type === "minute"; })
      .map(function (p) { return p.value; })
      .join(":");

    var period = parts.find(function (p) { return p.type === "dayPeriod"; });
    periodEl.textContent = period ? period.value : "";
  }

  renderClock();
  setInterval(renderClock, 60000);
</script>
</body>
